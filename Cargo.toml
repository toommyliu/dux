[package]
name = "dux"
version = "0.1.0"
edition = "2024"
description = "Fast disk usage explorer for understanding what is taking space"
repository = "https://github.com/toommyliu/dux"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
fff-search = "0.8.1"
ratatui = "0.29"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[dev-dependencies]
tempfile = "3"
